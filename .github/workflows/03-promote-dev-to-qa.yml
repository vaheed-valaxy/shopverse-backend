# Triggered manually — picks up the image currently running in DEV and opens
# a PR in the GitOps repo (vars.GITOPS_REPO) to promote it to QA.
# QA ArgoCD app auto-syncs after merge.

name: Promote — Backend - DEV - To - QA

on:
  workflow_dispatch: 

permissions:
  contents: read
  id-token: write

jobs:        
  promote-dev-to-qa:
    uses: vaheed-valaxy/central-github-actions/.github/workflows/promote-dev-to-qa.yml@main
    with:
      service-name: backend
      gitops-repo: shopverse-gitops
      gitops-owner: vaheed-valaxy
      dev-repo: shopverse-dev/backend
      qa-repo: shopverse-qa/backend
      aws-region: us-east-1
      aws-ecr-qa-promotion-role-arn: arn:aws:iam::123456789012:role/shopverse-qa-promotion
    secrets:
      GITOPS_REPOSITORY_TOKEN: ${{ secrets.GITOPS_REPOSITORY_TOKEN }}
