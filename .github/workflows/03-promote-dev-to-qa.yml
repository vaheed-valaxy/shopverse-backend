# Triggered manually — picks up the image currently running in DEV and opens
# a PR in the GitOps repo (vars.GITOPS_REPO) to promote it to QA.
# QA ArgoCD app auto-syncs after merge.

name: Promote — Backend - DEV - To - QA

on:
  workflow_dispatch: 

permissions:
  contents: read
  id-token: write

env:
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}
  # GITOPS_OWNER: vaheed-valaxy

  DEV_REPO: shopverse-dev/backend
  QA_REPO: shopverse-qa/backend

  AWS_ECR_QA_PROMOTION_ROLE_ARN: ${{ secrets.AWS_ECR_QA_PROMOTION_ROLE_ARN }}
  AWS_REGION: us-east-1
  
  # CRANE_VERSION: v0.21.7

jobs:
  Config-Job:
    name: Configuration Job
    runs-on: ubuntu-latest

    outputs:
      gitops-repo: ${{ steps.load-values.outputs.gitops-repo }}
      dev-repo: ${{ steps.load-values.outputs.dev-repo }}
      qa-repo: ${{ steps.load-values.outputs.qa-repo }}
      aws-region: ${{ steps.load-values.outputs.aws-region }}
      aws-ecr-qa-promotion-role-arn: ${{ steps.load-values.outputs.aws-ecr-qa-promotion-role-arn }}
      # gitops-owner: ${{ steps.load-values.outputs.gitops-owner }}
      
    steps:
      - name: Load Env Values
        id: load-values
        run: |
          echo "gitops-repo=$GITOPS_REPO" >> "GITHUB_OUTPUT"
          echo "dev-repo=$DEV_REPO" >> "GITHUB_OUTPUT"
          echo "qa-repo=$QA_REPO" >> "GITHUB_OUTPUT"
          echo "aws-region=$AWS_REGION" >> "GITHUB_OUTPUT"
          echo "aws-ecr-qa-promotion-role-arn=$AWS_ECR_QA_PROMOTION_ROLE_ARN" >> "GITHUB_OUTPUT"
          # echo "gitops-owner=$GITOPS_OWNER" >> "GITHUB_OUTPUT"

          echo "gitops-repo: $GITOPS_REPO" 
          echo "dev-repo: $DEV_REPO" 
          echo "qa-repo: $QA_REPO" 
          echo "aws-region: $AWS_REGION" 
          echo "aws-ecr-qa-promotion-role-arn: $AWS_ECR_QA_PROMOTION_ROLE_ARN"
          
  Promote-Job:
    uses: vaheed-valaxy/central-github-actions/.github/workflows/reusable-promote-dev-to-qa.yml@main
    needs: Config-Job
    with:
      service-name: backend
      gitops-repo: ${{ needs.Config-Job.outputs.gitops-repo }}
      dev-repo: ${{ needs.Config-Job.outputs.dev-repo }}
      qa-repo: ${{ needs.Config-Job.outputs.qa-repo }}
      aws-region: ${{ needs.Config-Job.outputs.aws-region }}
      aws-ecr-qa-promotion-role-arn: ${{ needs.Config-Job.outputs.aws-ecr-qa-promotion-role-arn }}
      # gitops-owner: ${{ needs.Config-Job.outputs.gitops-owner }}
