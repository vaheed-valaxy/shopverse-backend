  Create-PR-Job:
    name: Create PR to develop branch

    runs-on: ubuntu-latest

    needs:
      - Code-Scan-Job

    permissions:
      contents: read
      pull-requests: write

    steps:

      - name: Debug GitHub Token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          echo "=================================================="
          echo "GitHub Actions Token Debug"
          echo "=================================================="

          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""
          echo "Branch:"
          echo "${GITHUB_REF_NAME}"

          echo ""
          echo "Event:"
          echo "${GITHUB_EVENT_NAME}"

          echo ""
          echo "Actor:"
          echo "${GITHUB_ACTOR}"

          echo ""
          echo "Checking repository access..."
          
          gh api \
            "/repos/${GITHUB_REPOSITORY}" \
            --jq '.full_name'

          echo ""
          echo "Checking existing PRs..."

          gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${GITHUB_REF_NAME}" \
            --base develop \
            --state open \
            --json number,title

          echo ""
          echo "Checking token permissions..."

          gh api \
            -i \
            "/repos/${GITHUB_REPOSITORY}" \
            | grep -i "x-oauth-scopes" || true

          echo ""
          echo "=================================================="
          echo "Debug completed"
          echo "=================================================="


      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          BRANCH="${GITHUB_REF_NAME}"

          echo "=================================================="
          echo "Creating Pull Request"
          echo "Source Branch : ${BRANCH}"
          echo "Target Branch : develop"
          echo "=================================================="

          EXISTING_PR=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${BRANCH}" \
            --base develop \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "${EXISTING_PR}" ]; then
            echo "PR #${EXISTING_PR} already exists."
            exit 0
          fi

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${BRANCH}" \
            --base develop \
            --title "PR: ${BRANCH} -> develop" \
            --body "Automated PR after successful security scans."
